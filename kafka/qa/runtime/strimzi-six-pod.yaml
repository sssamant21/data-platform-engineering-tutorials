apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controllers
  labels:
    strimzi.io/cluster: qa-six
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: ephemeral
  resources:
    requests: {memory: 512Mi, cpu: 150m}
    limits: {memory: 1536Mi, cpu: "2"}
  jvmOptions: {"-Xms": "256m", "-Xmx": "512m"}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: qa-six
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: ephemeral
  resources:
    requests: {memory: 512Mi, cpu: 150m}
    limits: {memory: 1536Mi, cpu: "2"}
  jvmOptions: {"-Xms": "256m", "-Xmx": "512m"}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: qa-six
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: qa-six-events
  labels:
    strimzi.io/cluster: qa-six
spec:
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 600000
