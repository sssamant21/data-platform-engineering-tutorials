global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: postgres-lab
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels:
          environment: lab
          cluster: chapter004
