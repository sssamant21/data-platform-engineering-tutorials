name: Kafka Chapter 001 Lab Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kafka/qa/runtime/strimzi-single-node.yaml'
      - 'kafka/qa/certify_chapter_001.py'
      - 'kafka/qa/certify_chapter_001_recovery.py'
      - 'kafka/qa/labs/phase-05-02-chapter-001.md'
      - 'kafka/qa/labs/phase-05-03-chapter-001-recovery.md'
      - '.github/workflows/kafka-chapter-001-certification.yml'
      - '.github/workflows/kafka-chapter-001-recovery.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chapter-001:
    name: Chapter 001 Kubernetes messaging acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create isolated kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: kafka-qa
          wait: 120s
      - name: Confirm isolated context
        run: test "$(kubectl config current-context)" = "kind-kafka-qa"
      - name: Install pinned Strimzi operator
        run: |
          kubectl --context kind-kafka-qa create namespace kafka-qa
          helm repo add strimzi https://strimzi.io/charts/
          helm repo update strimzi
          helm install kafka-qa-operator strimzi/strimzi-kafka-operator \
            --version 0.47.0 --namespace kafka-qa \
            --set watchAnyNamespace=false --wait --timeout 5m
      - name: Deploy Kafka and topic fixture
        run: kubectl --context kind-kafka-qa -n kafka-qa apply -f kafka/qa/runtime/strimzi-single-node.yaml
      - name: Run Chapter 001 acceptance test
        run: python kafka/qa/certify_chapter_001.py
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p kafka/qa/evidence
          kubectl --context kind-kafka-qa -n kafka-qa get kafka,kafkanodepools,kafkatopics,pods -o wide > kafka/qa/evidence/chapter-001-resources.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa get events --sort-by=.metadata.creationTimestamp > kafka/qa/evidence/chapter-001-events.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa logs deployment/strimzi-cluster-operator --tail=200 > kafka/qa/evidence/chapter-001-operator.log 2>&1 || true
      - name: Upload Chapter 001 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chapter-001-certification-${{ github.run_id }}
          path: kafka/qa/evidence/chapter-001-*
          if-no-files-found: warn
          retention-days: 7
