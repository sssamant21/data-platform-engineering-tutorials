name: Kafka Chapter 017 Consumer Offset Reliability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kafka-ch017-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chapter-017:
    name: Chapter 017 consumer group and offset replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create isolated kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: kafka-qa
          wait: 120s
      - name: Verify isolated context and install Strimzi
        run: |
          test "$(kubectl config current-context)" = "kind-kafka-qa"
          kubectl --context kind-kafka-qa create namespace kafka-qa
          helm repo add strimzi https://strimzi.io/charts/
          helm repo update strimzi
          helm install kafka-qa-operator strimzi/strimzi-kafka-operator \
            --version 0.47.0 --namespace kafka-qa \
            --set watchAnyNamespace=false --wait --timeout 5m
          kubectl --context kind-kafka-qa -n kafka-qa rollout status \
            deployment/strimzi-cluster-operator --timeout=180s
      - name: Deploy three-broker Kafka fixture
        run: |
          kubectl --context kind-kafka-qa -n kafka-qa apply \
            -f kafka/qa/runtime/strimzi-three-node-ch004.yaml
      - name: Execute Chapter 017 consumer offset acceptance
        run: python kafka/qa/run_chapter_017.py
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p kafka/qa/evidence
          kubectl --context kind-kafka-qa -n kafka-qa get pods,kafka,kafkanodepool,kafkatopic,pvc -o wide > kafka/qa/evidence/chapter-017-resources.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa get events --sort-by=.metadata.creationTimestamp > kafka/qa/evidence/chapter-017-events.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa logs deployment/strimzi-cluster-operator --tail=200 > kafka/qa/evidence/chapter-017-operator-log.txt 2>&1 || true
      - name: Upload Chapter 017 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kafka-chapter-017-${{ github.run_id }}
          path: kafka/qa/evidence/
          if-no-files-found: warn
          retention-days: 7
