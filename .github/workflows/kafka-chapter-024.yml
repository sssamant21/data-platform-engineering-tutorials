name: Kafka Chapter 024 Tiered Storage Compatibility Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kafka/qa/run_chapter_024.py"
      - "kafka/qa/runtime/TieredPreflight.java"
      - "kafka/qa/test_chapter_024.py"
      - "kafka/qa/run_chapter_021.py"
      - "kafka/qa/runtime/strimzi-three-node-persistent-ch021.yaml"
      - "kafka/05-storage-retention-compaction-tiered-storage/024-*.md"
      - "kafka/qa/runtime_acceptance.py"
      - ".github/workflows/kafka-chapter-024.yml"

permissions:
  contents: read

concurrency:
  group: kafka-ch024-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chapter-024:
    name: Chapter 024 local baseline and remote integration no-go gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Static and guard tests
        run: |
          python -m py_compile kafka/qa/run_chapter_024.py kafka/qa/select_changed_chapters.py
          python -m unittest discover -s kafka/qa -p "test_chapter_0*.py" -v
      - name: Create isolated kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: kafka-qa
          wait: 120s
      - name: Verify isolated context and install Strimzi
        run: |
          test "$(kubectl config current-context)" = "kind-kafka-qa"
          kubectl --context kind-kafka-qa create namespace kafka-qa
          helm repo add strimzi https://strimzi.io/charts/
          helm repo update strimzi
          helm install kafka-qa-operator strimzi/strimzi-kafka-operator \
            --version 0.47.0 --namespace kafka-qa \
            --set watchAnyNamespace=false --wait --timeout 5m
          kubectl --context kind-kafka-qa -n kafka-qa rollout status \
            deployment/strimzi-cluster-operator --timeout=180s
      - name: Verify disposable local-path StorageClass
        run: kubectl --context kind-kafka-qa get storageclass standard -o yaml
      - name: Deploy persistent three-broker Kafka fixture
        run: |
          kubectl --context kind-kafka-qa -n kafka-qa apply \
            -f kafka/qa/runtime/strimzi-three-node-persistent-ch021.yaml
      - name: Execute Chapter 024 local-only tiered-storage preflight
        env:
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python kafka/qa/run_chapter_024.py
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p kafka/qa/evidence
          kubectl --context kind-kafka-qa -n kafka-qa get pods,kafka,kafkanodepool,kafkatopic,pvc,pv,storageclass -o wide > kafka/qa/evidence/chapter-024-resources.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa get events --sort-by=.metadata.creationTimestamp > kafka/qa/evidence/chapter-024-events.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa logs deployment/strimzi-cluster-operator --tail=200 > kafka/qa/evidence/chapter-024-operator-log.txt 2>&1 || true
      - name: Capture storage diagnostics
        if: always()
        run: |
          mkdir -p kafka/qa/evidence
          kubectl --context kind-kafka-qa -n kafka-qa get pvc -o yaml > kafka/qa/evidence/chapter-024-pvc-diagnostics.yaml 2>&1 || true
          kubectl --context kind-kafka-qa get pv,storageclass -o yaml > kafka/qa/evidence/chapter-024-pv-storageclass-diagnostics.yaml 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa logs -l strimzi.io/pool-name=dual-role -c kafka --prefix --tail=100 --max-log-requests=3 > kafka/qa/evidence/chapter-024-broker-diagnostics.log 2>&1 || true
      - name: Destroy disposable cluster
        if: always()
        run: kind delete cluster --name kafka-qa
      - name: Upload Chapter 024 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kafka-chapter-024-${{ github.run_id }}
          path: kafka/qa/evidence/
          if-no-files-found: warn
          retention-days: 7
