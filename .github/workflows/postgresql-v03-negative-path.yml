name: PostgreSQL V03 Isolated Negative Path Acceptance

on:
  push:
    branches: [qa/postgresql-v03-slot-preflight-20261030]
    paths:
      - "postgresql/scripts/004-operations-lab.sh"
      - "postgresql/labs/sql/047-*.sql"
      - "postgresql/labs/sql/048-*.sql"
      - "postgresql/validation/v03_negative_path.py"
      - ".github/workflows/postgresql-v03-negative-path.yml"
  pull_request:
    paths:
      - "postgresql/scripts/004-operations-lab.sh"
      - "postgresql/labs/sql/047-*.sql"
      - "postgresql/labs/sql/048-*.sql"
      - "postgresql/validation/v03_negative_path.py"
      - ".github/workflows/postgresql-v03-negative-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-pg18-negative-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python driver and validate Bash syntax (no database)
        run: |
          python3 -m py_compile postgresql/validation/v03_negative_path.py
          bash -n postgresql/scripts/004-operations-lab.sh

      - name: Build PostgreSQL 18 isolated test image
        run: |
          docker build -t postgresql-v03-negative-path:pg18 - <<'DOCKERFILE'
          FROM postgres:18
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Execute fail-closed scenarios against disposable loopback topology
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --user postgres \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            postgresql-v03-negative-path:pg18 \
            bash -euo pipefail -c '
              result="$(bash postgresql/scripts/004-operations-lab.sh setup)"
              printf "%s\n" "$result"
              PG_LAB_ROOT="$(printf "%s\n" "$result" | sed -n "s/^export PG_LAB_ROOT=//p" | tail -n 1)"
              [[ "$PG_LAB_ROOT" =~ ^/tmp/postgresql-dbre-lab\.[A-Za-z0-9]+$ ]] || exit 2
              export PG_LAB_ROOT PGPASSFILE="$PG_LAB_ROOT/credentials.pgpass"
              bash postgresql/scripts/004-operations-lab.sh verify
              export PG_V03_CONFIRM_ISOLATED=047-048-DISPOSABLE-ONLY
              python3 postgresql/validation/v03_negative_path.py
              export PG_LAB_CONFIRM_DESTROY=yes
              bash postgresql/scripts/004-operations-lab.sh destroy
            ' 2>&1 | tee postgresql-v03-negative-path.log

      - name: Retain redacted runtime acceptance output (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-v03-negative-path
          path: postgresql-v03-negative-path.log
          if-no-files-found: warn
