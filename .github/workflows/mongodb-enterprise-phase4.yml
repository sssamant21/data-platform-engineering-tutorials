name: MongoDB Enterprise Phase 4 Offline Validation

on:
  push:
    branches:
      - audit/mongodb-dbre-sre-readiness
    paths:
      - 'mongodb-enterprise/**'
      - '.github/workflows/mongodb-enterprise-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-l0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture validation provenance
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import platform
          import subprocess
          payload = {
              "schema": "mongodb-phase4-ci-provenance-v1",
              "commit_sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python_version": platform.python_version(),
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "chapter_count_expected": 80,
              "runtime_certified": False,
          }
          with open("phase4-ci-provenance.json", "w", encoding="utf-8") as out:
              json.dump(payload, out, indent=2)
              out.write("\n")
          PY
      - name: Compile validation scripts
        run: python -m compileall -q mongodb-enterprise/validation
      - name: Run synthetic positive and negative tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s mongodb-enterprise/validation -p 'test_*.py' -v 2>&1 | tee phase4-offline-tests.log
      - name: Run offline tests with Python optimization
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -O -m unittest discover -s mongodb-enterprise/validation -p 'test_*.py' -v 2>&1 | tee phase4-offline-tests-optimized.log
      - name: Audit all 80 real chapters
        if: success() || failure()
        run: |
          python mongodb-enterprise/validation/structure_check.py \
            --root mongodb-enterprise \
            --output phase4-l0-results.json
      - name: Check Chapters 01–04 documentation contract
        if: success() || failure()
        run: |
          python mongodb-enterprise/validation/ch01_04_contract.py \
            --root mongodb-enterprise \
            --output phase4-ch01-04-contract.json
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-enterprise-phase4-l0
          path: |
            phase4-l0-results.json
            phase4-ch01-04-contract.json
            phase4-offline-tests.log
            phase4-offline-tests-optimized.log
            phase4-ci-provenance.json
          if-no-files-found: warn
          retention-days: 30
