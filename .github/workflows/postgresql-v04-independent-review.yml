name: PostgreSQL V04-B Independent Staging Review (Offline)

on:
  push:
    branches: [qa/postgresql-v03-slot-preflight-20261030]
    paths:
      - "postgresql/validation/v04_independent_review.py"
      - "postgresql/validation/test_v04_independent_review.py"
      - "postgresql/validation/v04_independent_review.template.json"
      - "postgresql/validation/v04_staging_readiness.py"
      - "postgresql/validation/v04_staging_evidence.template.json"
      - ".github/workflows/postgresql-v04-independent-review.yml"
  pull_request:
    paths:
      - "postgresql/validation/v04_independent_review.py"
      - "postgresql/validation/test_v04_independent_review.py"
      - "postgresql/validation/v04_independent_review.template.json"
      - "postgresql/validation/v04_staging_readiness.py"
      - "postgresql/validation/v04_staging_evidence.template.json"
      - ".github/workflows/postgresql-v04-independent-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-independent-review-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax without database access
        run: |
          python3 -m py_compile postgresql/validation/v04_independent_review.py
          python3 -m py_compile postgresql/validation/test_v04_independent_review.py

      - name: Run synthetic independence and NO-GO regression
        run: python3 -m unittest -v postgresql/validation/test_v04_independent_review.py

      - name: Confirm provided public review templates are NO-GO
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 postgresql/validation/v04_independent_review.py \
              --staging postgresql/validation/v04_staging_evidence.template.json \
              --review postgresql/validation/v04_independent_review.template.json \
              --json-out v04b-template-no-go.json; then
            echo "FAIL: public V04-B template cannot be review-complete" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("v04b-template-no-go.json", encoding="utf-8") as stream:
              result=json.load(stream)
          assert result["result"] == "NO_GO"
          assert result["authorization"] == "NONE"
          assert result["execution"] == "NEVER"
          assert result["reviewed_real_staging"] is False
          assert "v04a_staging_no_go" in result["reason_codes"]
          print("PASS: independent review correctly refuses missing staging records")
          PY

      - name: Retain synthetic V04-B NO-GO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-v04b-synthetic-no-go
          path: v04b-template-no-go.json
          if-no-files-found: warn
