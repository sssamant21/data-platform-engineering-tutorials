name: Redis Enterprise V02 examples and expected-results inventory

on:
  pull_request:
    paths:
      - "redis-enterprise/**"
      - ".github/workflows/redis-enterprise-v02.yml"
  push:
    branches: [main]
    paths:
      - "redis-enterprise/**"
      - ".github/workflows/redis-enterprise-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v02-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: V02 fixture-only validator tests
        run: python -m unittest discover -s redis-enterprise/tools -p "test_validate_v02_examples.py" -v
      - name: V02 offline example inventory
        run: python redis-enterprise/tools/validate_v02_examples.py --json-file "$RUNNER_TEMP/redis-v02-review.json"
      - name: Upload example review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-enterprise-v02-review
          path: ${{ runner.temp }}/redis-v02-review.json
          if-no-files-found: warn
