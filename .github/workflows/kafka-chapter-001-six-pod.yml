name: Kafka Chapter 001 Six-Pod Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kafka/qa/runtime/strimzi-six-pod.yaml'
      - 'kafka/qa/certify_chapter_001_six_pod.py'
      - 'kafka/qa/labs/phase-05-05-chapter-001-six-pod.md'
      - '.github/workflows/kafka-chapter-001-six-pod.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-pod:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create isolated kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: kafka-qa
          wait: 120s
      - name: Verify disposable context
        run: test "$(kubectl config current-context)" = "kind-kafka-qa"
      - name: Install Strimzi
        run: |
          kubectl --context kind-kafka-qa create namespace kafka-qa
          helm repo add strimzi https://strimzi.io/charts/
          helm repo update strimzi
          helm install kafka-qa-operator strimzi/strimzi-kafka-operator \
            --version 0.47.0 --namespace kafka-qa \
            --set watchAnyNamespace=false --wait --timeout 5m
      - name: Deploy dedicated controllers and brokers
        run: kubectl --context kind-kafka-qa -n kafka-qa apply -f kafka/qa/runtime/strimzi-six-pod.yaml
      - name: Validate architecture and broker failure recovery
        run: python kafka/qa/certify_chapter_001_six_pod.py
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p kafka/qa/evidence
          kubectl --context kind-kafka-qa -n kafka-qa get pods,kafka,kafkatopics,kafkanodepools -o wide > kafka/qa/evidence/chapter-001-six-pod-resources.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa get events --sort-by=.metadata.creationTimestamp > kafka/qa/evidence/chapter-001-six-pod-events.txt 2>&1 || true
          kubectl --context kind-kafka-qa -n kafka-qa logs deployment/strimzi-cluster-operator --tail=200 > kafka/qa/evidence/chapter-001-six-pod-operator.log 2>&1 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chapter-001-six-pod-${{ github.run_id }}
          path: kafka/qa/evidence/chapter-001-six-pod-*
          retention-days: 7
          if-no-files-found: warn
